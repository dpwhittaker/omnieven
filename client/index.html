<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Omni</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #232323; color: #E5E5E5;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
      }
      #app { display: flex; flex-direction: column; height: 100%; }
      header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
      h1 { font-size: 19px; margin: 0; letter-spacing: 0.04em; flex: 1; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
      .dot.ok { background: #3fbf7f; } .dot.bad { background: #e05a5a; } .dot.wait { background: #e0b64a; }
      nav { display: flex; gap: 6px; padding: 10px 16px; }
      nav button { flex: 1; padding: 9px; border-radius: 8px; border: 0; background: #2e2e2e; color: #bbb; font-size: 14px; font-weight: 600; }
      nav button.on { background: #3fbf7f; color: #0b1f14; }
      section { display: none; flex: 1; flex-direction: column; gap: 12px; padding: 0 16px 16px; min-height: 0; }
      section.on { display: flex; }
      label { display: block; font-size: 12px; color: #999; margin-bottom: 4px; }
      input {
        width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #444; background: #161616; color: #eee; font-size: 15px;
      }
      .row { display: flex; gap: 8px; }
      button.primary, button.secondary { flex: 1; padding: 12px; border-radius: 8px; border: 0; font-size: 15px; font-weight: 600; }
      button.primary { background: #3fbf7f; color: #0b1f14; } button.secondary { background: #3a3a3a; color: #ddd; }
      .status { padding: 10px 12px; border-radius: 8px; font-size: 13px; background: #2e2e2e; }
      .status.ok { background: #1e3b2b; color: #9ff0c0; } .status.bad { background: #3b1e1e; color: #f0a0a0; } .status.wait { background: #3b331e; color: #f0dc9f; }
      pre { flex: 1; margin: 0; padding: 10px; background: #111; border-radius: 8px; overflow: auto; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #9a9; white-space: pre-wrap; min-height: 80px; }
      /* apps tab */
      #applist { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
      .group { font-size: 12px; color: #888; margin: 8px 0 2px; text-transform: uppercase; letter-spacing: .06em; }
      .appitem { display: flex; align-items: center; gap: 10px; background: #2b2b2b; border-radius: 10px; padding: 10px 12px; }
      .appitem .t { flex: 1; font-weight: 600; } .appitem .t small { display: block; font-weight: normal; color: #999; font-size: 12px; }
      .appitem.active { outline: 2px solid #3fbf7f; }
      .appitem button { padding: 8px 10px; border-radius: 8px; border: 0; background: #3a3a3a; color: #ddd; font-size: 13px; }
      .appitem button.go { background: #3fbf7f; color: #0b1f14; font-weight: 600; }
      #panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
      #panel.on { display: flex; }
      #panel .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      #panel .bar b { flex: 1; }
      #panel iframe { flex: 1; border: 0; border-radius: 10px; background: #232323; width: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <header><h1>Omni</h1><span id="dot" class="dot"></span></header>
      <nav><button id="tab-apps" class="on">Apps</button><button id="tab-connect">Connect</button></nav>

      <section id="sec-apps" class="on">
        <div id="applist"><div class="status wait">Connect to see your apps.</div></div>
        <div id="panel">
          <div class="bar"><button class="secondary" id="panel-close" style="flex:0 0 auto">‹ Apps</button><b id="panel-title"></b><button class="secondary" id="panel-reload" style="flex:0 0 auto">↻</button></div>
          <iframe id="panel-frame" title="app page"></iframe>
        </div>
      </section>

      <section id="sec-connect">
        <div id="status" class="status wait">Starting…</div>
        <div>
          <label for="url">Server WebSocket URL</label>
          <input id="url" placeholder="wss://your-server.example.com/ws" autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>
        <div>
          <label for="token">Token</label>
          <input id="token" placeholder="paste the token printed by the server" autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>
        <div class="row">
          <button id="save" class="primary">Save &amp; connect</button>
          <button id="disconnect" class="secondary">Disconnect</button>
        </div>
        <pre id="log"></pre>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
